<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baghdad Digital Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="twin.css?v=4">
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Loading the digital twin…</div>
    <div class="loader-sub" id="loader-sub">buildings, roads, trees</div>
  </div>

  <!-- top-left: what the buildings show -->
  <div class="panel modes" id="modes"></div>

  <!-- top-right: basemap, layers, quality -->
  <div class="panel side" id="side">
    <div class="side-title">Map</div>
    <div class="seg" id="basemaps"></div>
    <div class="side-title">Layers</div>
    <label class="tog"><input type="checkbox" id="tog-traffic" checked><span></span>Moving traffic</label>
    <label class="tog"><input type="checkbox" id="tog-trees" checked><span></span>3D trees</label>
    <label class="tog"><input type="checkbox" id="tog-cells"><span></span>Zone grid overlay</label>
    <label class="tog"><input type="checkbox" id="tog-labels" checked><span></span>Labels</label>
    <label class="tog" id="tog-delta-wrap"><input type="checkbox" id="tog-delta"><span></span>Show change vs baseline</label>
    <div class="side-title">Quality</div>
    <div class="seg" id="quality"></div>
    <div class="perf" id="perf">measuring…</div>
  </div>

  <!-- bottom: time of day -->
  <div class="panel timebar">
    <button id="play" class="play" title="Play the day">▶</button>
    <div class="time-main">
      <div class="time-row"><span class="sun" id="sun">☀</span><span id="clock">15:00</span><span class="time-sub" id="time-sub">average July day</span></div>
      <input type="range" id="hour" min="0" max="23.99" step="0.01" value="15">
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    </div>
  </div>

  <!-- bottom-left: legend -->
  <div class="panel legend" id="legend"></div>

  <!-- scenario badge -->
  <div class="scenario" id="scenario"></div>

  <!-- building card -->
  <aside class="panel card hidden" id="card">
    <button class="close" id="card-close" title="Close">×</button>
    <div class="card-kicker" id="card-kicker"></div>
    <div class="card-title" id="card-title"></div>
    <div class="object-wrap"><canvas id="object3d"></canvas><div class="object-hint">drag to rotate</div></div>
    <div class="card-grid" id="card-grid"></div>
    <div class="spark-title">Average day in this zone <span id="spark-metric"></span></div>
    <svg class="spark" id="spark" viewBox="0 0 240 64" preserveAspectRatio="none"></svg>
    <div class="card-note" id="card-note"></div>
    <div class="card-actions">
      <button id="orbit-btn" class="ghost">⟳ Orbit</button>
      <button id="isolate-btn" class="ghost">◎ Isolate</button>
      <button id="back-btn" class="ghost">⤢ Back to overview</button>
    </div>
  </aside>

  <div class="hint" id="hint">Click any building to fly to it</div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/deck.gl.min.js"></script>
<script src="twin.js?v=3"></script>
</body>
</html>
